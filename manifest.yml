# UI Kit 2 configuration for Sentinel Vault app
app:
  id: ari:cloud:ecosystem::app/c30bf71e-4287-4872-954d-db49cc68f0ff
  runtime:
    name: nodejs22.x
  # Paid-via-Atlassian licensing. When true, Forge populates context.license (in the
  # PRODUCTION Marketplace listing only — it stays undefined in dev/custom envs, so the
  # dev install keeps working). check-license (entitlements/actions.js) reads
  # context.license.active biased fail-open, and the app SOFT-DEGRADES (a nag banner) when
  # unlicensed — a content-protection app must never hard-block and stop protecting content.
  # NOTE: the actual price/tiers are set in the Marketplace Partner portal, not here.
  licensing:
    enabled: true

modules:
  # Atlassian-hosted LLM (Forge LLMs) — powers Semantic AI Validations with no
  # external egress, so the app keeps its "Runs on Atlassian" badge. Adding this
  # module triggers a major version bump + admin re-consent.
  llm:
    - key: sentinel-vault-llm
      model:
        - claude

  # Macro module — inline seal status panel on page content
  macro:
    - key: sentinel-vault-panel
      resource: inline-panel-ui
      resolver:
        function: action-router
      title: Sentinel Vault
      description: Shows seal status for every file on this page
      layout: block
      categories:
        - admin
      config:
        resource: panel-setup-ui
        openOnInsert: false
        viewportSize: medium

    # Bodied macro — wraps a sealed page section. Carries a stable app-issued
    # sectionId so the page-content trigger can detect tampering and restore it.
    - key: sentinel-vault-sealed-section
      resource: section-setup-ui
      resolver:
        function: action-router
      title: Sentinel Vault Sealed Section
      description: Locks the content inside this section against unauthorized edits
      layout: bodied
      categories:
        - admin
      config:
        resource: section-setup-ui
        openOnInsert: true
        viewportSize: medium

  # 5.0 — the classification chip under every page title (always present). Confluence renders
  # title / icon / tooltip from the content property `sentinel-byline` (written by the seal,
  # section and classification resolvers — no resolver call on render); the click opens the
  # page-details modal, the page-level hub that replaces "Manage Attachments".
  confluence:contentBylineItem:
    - key: sentinel-vault-byline
      resource: page-details-ui
      resolver:
        function: action-router
      title: Sentinel Vault
      tooltip: Classification and seals on this page
      contentPropertyKey: sentinel-byline
      viewportContainer: modal
      viewportSize: large

  # 5.0 — "Seal attachments…" in the page ⋯ menu: the primary way to protect a file. The macro
  # becomes an optional dashboard, not the gate.
  confluence:contentAction:
    - key: sentinel-vault-seal-action
      resource: page-details-ui
      resolver:
        function: action-router
      title: Seal attachments…
      viewportSize: large

  # Page ribbon for seal and classification notifications
  confluence:pageBanner:
    - key: sentinel-vault-ribbon
      resource: doc-ribbon
      resolver:
        function: action-router

  # DEV-ONLY harness test-state endpoint (gated by HARNESS_SECRET; 404 in prod).
  webtrigger:
    - key: harness-test-state
      function: testStateFn
    # Config REST API (docs/REST-CONFIG-API.md). STATIC response on purpose: a static trigger
    # cannot egress anything the manifest did not spell out, which keeps "Runs on Atlassian".
    # The job id is the caller's Idempotency-Key; the receipt is read from Confluence properties.
    - key: config-api
      function: config-api-fn
      urlFormat: v2
      response:
        type: static
        outputs:
          - key: accepted
            statusCode: 202
            contentType: application/json
            body: '{"status":"accepted"}'
          - key: invalid
            statusCode: 400
            contentType: application/json
            body: '{"status":"invalid"}'
          - key: unauthorized
            statusCode: 401
            contentType: application/json
            body: '{"status":"unauthorized"}'
          - key: forbidden
            statusCode: 403
            contentType: application/json
            body: '{"status":"forbidden"}'
          - key: not-allowed
            statusCode: 405
            contentType: application/json
            body: '{"status":"not-allowed"}'
          - key: conflict
            statusCode: 409
            contentType: application/json
            body: '{"status":"conflict"}'
          - key: busy
            statusCode: 429
            contentType: application/json
            body: '{"status":"busy"}'

  # Backend resolver functions
  function:
    - key: testStateFn
      handler: boot.testStateTrigger
    - key: action-router
      handler: boot.actionRouter
    - key: artifact-trigger
      handler: boot.artifactEventTrigger
    - key: lifecycle-trigger
      handler: boot.lifecycleTrigger
    - key: expiry-sweep-task
      handler: boot.expirySweepTask
    - key: recurring-nudge-task
      handler: boot.recurringNudgeTask
    - key: realm-scan-consumer-fn
      handler: boot.realmScanConsumer
      timeoutSeconds: 900
    - key: seal-index-cron-fn
      handler: boot.sealIndexCron
    - key: workflow-sweep-fn
      handler: boot.workflowSweep
    # Judges pages that carry a live seal ahead of their (often late) page event.
    - key: page-guard-sweep-fn
      handler: boot.pageGuardSweep
    - key: page-content-trigger
      handler: boot.pageContentTrigger
    - key: ai-validation-fn
      handler: boot.aiValidationConsumer
      timeoutSeconds: 120
    - key: config-api-fn
      handler: boot.configApiTrigger
    - key: config-api-consumer-fn
      handler: boot.configApiConsumer
      timeoutSeconds: 300

  # Queue consumer for async realm admin scanning
  consumer:
    - key: realm-audit-queue
      queue: realm-audit-queue
      function: realm-scan-consumer-fn
    # Async consumer for long-running Semantic AI validation (LLM call > 25s
    # resolver limit). Mirrors the realm-audit-queue pattern.
    - key: ai-validation-queue
      queue: ai-validation-queue
      function: ai-validation-fn
    # Config REST API jobs (a bundle can outlive the 25 s web-trigger limit).
    - key: config-api-queue
      queue: config-api-queue
      function: config-api-consumer-fn

  # Attachment events trigger
  trigger:
    - key: attachment-events
      function: artifact-trigger
      events:
        - avi:confluence:updated:attachment
        - avi:confluence:trashed:attachment
        - avi:confluence:deleted:attachment
    - key: page-content-events
      function: page-content-trigger
      events:
        - avi:confluence:updated:page
        - avi:confluence:created:page
    - key: app-lifecycle-events
      function: lifecycle-trigger
      events:
        - avi:forge:installed:app
        - avi:forge:uninstalled:app

  # Scheduled triggers for automated tasks
  scheduledTrigger:
    - key: expiry-sweep-scheduled
      function: expiry-sweep-task
      interval: hour
    - key: recurring-nudge-scheduled
      function: recurring-nudge-task
      interval: day
    - key: seal-index-cron
      function: seal-index-cron-fn
      interval: hour
    - key: workflow-sweep-scheduled
      function: workflow-sweep-fn
      interval: hour
    - key: page-guard-sweep-scheduled
      function: page-guard-sweep-fn
      interval: fiveMinute

  # Sentinel Vault admin configuration module (Custom UI)
  confluence:globalSettings:
    - key: steward-console
      title: "Sentinel Vault — Site settings"
      resource: steward-console
      resolver:
        function: action-router

  # A7: one page, every space — what Sentinel Vault is waiting on the current user for
  # (approvals, edit requests on their sealed files) and the files they hold sealed.
  # Composes list-my-approvals / list-my-edit-requests / enumerate-operator-seals, all
  # scoped to req.context.accountId. No new scope; a module without one is a minor version.
  confluence:globalPage:
    - key: my-work
      title: "Sentinel Vault — My work"
      route: my-work
      resource: my-work
      resolver:
        function: action-router
      icon: "static/steward-console/assets/icon.png"

  # Realm-level administration (Custom UI)
  # Only visible to space administrators
  confluence:spacePage:
    - key: realm-console
      title: "Sentinel Vault"
      route: realm-console
      resource: realm-console
      resolver:
        function: action-router
      icon: "static/steward-console/assets/icon.png"

resources:
  - key: overlay
    path: static/overlay
  - key: steward-console
    path: static/steward-console
  - key: realm-console
    path: static/realm-console
  - key: doc-ribbon
    path: static/doc-ribbon
  - key: inline-panel-ui
    path: static/inline-panel
  - key: panel-setup-ui
    path: static/panel-setup
  - key: section-setup-ui
    path: static/section-setup
  - key: my-work
    path: static/my-work
  - key: page-details-ui
    path: static/page-details

permissions:
  scopes:
    # JSM Assets (2026-09-19, owner go): classification levels imported from an Assets object
    # type. Read-only; called asUser from the steward console only (asApp answers 401 on the
    # Assets API — see docs/CLASSIFICATION-ASSETS-DESIGN.md). Workspace id comes from JSM.
    - read:servicedesk-request
    - read:cmdb-schema:jira
    - read:cmdb-type:jira
    - read:cmdb-object:jira
    - read:cmdb-attribute:jira
    - read:confluence-content.all
    - read:confluence-content.summary
    - write:confluence-content
    - write:confluence-file
    - readonly:content.attachment:confluence
    - read:confluence-space.summary
    - read:space:confluence
    - read:confluence-props
    - write:confluence-props
    - read:confluence-content.permission
    - read:confluence-user
    - read:confluence-groups
    - search:confluence
    - read:content:confluence
    - read:content-details:confluence
    - read:page:confluence
    - write:page:confluence
    - write:content:confluence
    - read:attachment:confluence
    - write:attachment:confluence
    - delete:attachment:confluence
    - read:comment:confluence
    - write:comment:confluence
    - read:content.property:confluence
    - write:content.property:confluence
    - read:content.restriction:confluence
    - write:content.restriction:confluence
    - read:content.metadata:confluence
    - read:content.permission:confluence
    - read:label:confluence
    # 5.0 — data classification through Confluence's own API (Atlassian Guard levels):
    # read:configuration reads the site's levels, write:space sets a space's default level.
    - read:configuration:confluence
    - write:space:confluence
    - storage:app
  content:
    styles:
      - unsafe-inline
